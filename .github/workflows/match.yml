name: byte-match

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-24.04   # pinned so the runner image doesn't change underneath the checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pyelftools
        run: pip install pyelftools

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: toolchain/gcc-arm-8.2-2018.08-x86_64-arm-linux-gnueabihf.tar.xz
          key: arm-gnu-8.2-2018.08-5b3f20e1327edc30

      - name: Fetch and verify toolchain (Arm GNU 8.2-2018.08)
        run: echo "MIYOO_TC=$(scripts/fetch-toolchain.sh)" >> "$GITHUB_ENV"

      - name: Cache GCC 7.3.0 cross compiler (built from pinned upstream sources)
        uses: actions/cache@v6
        with:
          path: build/gcc73/install
          key: gcc73-${{ hashFiles('scripts/fetch-gcc73.sh') }}-arm-gnu-8.2-2018.08

      - name: Fetch and build GCC 7.3.0 (compiles DeviceAuth.c; stamped in MainUI's .comment)
        run: |
          command -v m4 >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends m4)
          scripts/fetch-gcc73.sh

      - name: Fetch and verify MainUI-354-clean (Onion commit 07505ea)
        run: scripts/fetch-mainui.sh

      - name: Verify environment
        run: scripts/verify.sh

      - name: Byte-match every rewrite in src/
        run: scripts/run_matches.sh

      - name: Check every whole unit (body + template tail) in docs/tu-map.tsv
        run: scripts/run_units.sh

      - name: Test relocation, initializer and dynamic-import checks
        run: python3 -m unittest discover -s tools/tests -v

      - name: Build MainUI and require it byte-identical to the original (full link audit)
        run: python3 tools/linkaudit.py --require-ready

      - name: Require ghidra/names.tsv to match the source names
        run: python3 tools/syncnames.py --check

      - name: Progress summary
        run: python3 tools/progress.py --md "$GITHUB_STEP_SUMMARY"
